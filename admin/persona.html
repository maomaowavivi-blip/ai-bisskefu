<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉祥物人设 · AI 智能客服</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<style>
.form-section { margin-bottom: var(--space-5); }
.form-section:last-child { margin-bottom: 0; }
.form-section-title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border-light);
}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <a href="dashboard.html" class="sidebar-brand">
      <div class="brand-icon">🤖</div>
      <div class="brand-text">
        <span class="brand-title">AI 智能客服</span>
        <span class="brand-sub">NebulaBot</span>
      </div>
    </a>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html" data-page="dashboard"><span class="nav-icon">📊</span><span class="nav-label">概览</span></a>
      <a class="nav-item active" href="persona.html" data-page="persona"><span class="nav-icon">🎭</span><span class="nav-label">吉祥物人设</span></a>
      <a class="nav-item" href="knowledge.html" data-page="knowledge"><span class="nav-icon">📚</span><span class="nav-label">知识库管理</span></a>
      <a class="nav-item" href="chat-logs.html" data-page="chat-logs"><span class="nav-icon">💬</span><span class="nav-label">对话记录</span></a>
      <a class="nav-item" href="users.html" data-page="users"><span class="nav-icon">👥</span><span class="nav-label">账号管理</span></a>
      <a class="nav-item" href="settings.html" data-page="settings"><span class="nav-icon">⚙️</span><span class="nav-label">系统设置</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">👤</div>
        <span class="user-name" id="sidebarUsername">管理员</span>
        <button class="logout-btn" onclick="doLogout()" title="退出登录">↩</button>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <main class="main-content">
    <header class="main-header">
      <div>
        <div class="page-title">吉祥物人设</div>
        <div class="page-sub">配置客服的姓名、性格、说话风格和品牌背景</div>
      </div>
    </header>
    <div class="main-body">
      <div class="loading" id="loading">
        <div class="loading-dots"><span></span><span></span><span></span></div>
        <span>加载人设数据...</span>
      </div>

      <form id="personaForm" style="display:none;">
        <div class="card" style="margin-bottom:var(--space-4);">
          <div class="card-header">
            <h3>📋 基本信息</h3>
          </div>
          <div class="form-section">
            <div class="form-group">
              <label class="form-label">吉祥物名称</label>
              <input type="text" class="form-input" id="name" placeholder="如：小智、小美" maxlength="50">
            </div>
            <div class="form-group">
              <label class="form-label">默认欢迎语</label>
              <input type="text" class="form-input" id="greeting" placeholder="如：您好呀~ 很高兴为您服务！" maxlength="200">
            </div>
            <div class="form-group">
              <label class="form-label">一句话描述</label>
              <input type="text" class="form-input" id="description" placeholder="如：我是您的专属客服小助手，随时为您服务" maxlength="200">
              <div class="form-hint">展示在聊天窗口头像旁，让用户快速了解机器人身份</div>
            </div>
            <div class="form-group">
              <label class="form-label">头像</label>
              <div style="display:flex;align-items:center;gap:var(--space-4);">
                <div style="width:72px;height:72px;border-radius:50%;overflow:hidden;border:2px solid var(--border-light);flex-shrink:0;background:rgba(255,255,255,0.03);">
                  <img id="avatarPreview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Ccircle cx='36' cy='36' r='36' fill='%233b82f6'/%3E%3Ctext x='36' y='46' text-anchor='middle' fill='white' font-size='30'%3E🤖%3C/text%3E%3C/svg%3E" style="width:100%;height:100%;object-fit:cover;display:block;">
                </div>
                <div style="flex:1;min-width:0;">
                  <input type="file" id="avatarFileInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none;">
                  <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('avatarFileInput').click()" style="font-size:var(--text-sm);">选择图片</button>
                    <button type="button" class="btn btn-primary" id="uploadAvatarBtn" onclick="uploadAvatar()" style="font-size:var(--text-sm);" disabled>上传头像</button>
                    <button type="button" class="btn btn-secondary" onclick="clearAvatar()" style="font-size:var(--text-sm);background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.15);color:#F87171;">清除头像</button>
                  </div>
                  <div class="form-hint" style="margin-top:var(--space-1);">支持 JPG、PNG、GIF、WebP，最大 5MB</div>
                  <div id="avatarUploadStatus" style="font-size:var(--text-sm);margin-top:var(--space-1);"></div>
                </div>
              </div>
              <input type="hidden" id="avatar_url">
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom:var(--space-4);">
          <div class="card-header">
            <h3>💬 人格设定</h3>
          </div>
          <div class="form-section">
            <div class="form-group">
              <label class="form-label">品牌故事</label>
              <p class="form-hint" style="margin-bottom:var(--space-2);">企业品牌起源、核心理念（<strong>不进入 AI 提示词</strong>，请同步录入<a href="knowledge.html">知识库</a>，由检索召回）</p>
              <textarea class="form-textarea" id="brand_story" placeholder="企业品牌起源、核心理念..." rows="3"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">性格描述</label>
              <p class="form-hint" style="margin-bottom:var(--space-2);">核心性格特征</p>
              <textarea class="form-textarea" id="personality" placeholder="如：热情、耐心、专业、可爱..." rows="2"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">说话风格</label>
              <p class="form-hint" style="margin-bottom:var(--space-2);">语气、称呼方式、口头禅</p>
              <textarea class="form-textarea" id="speak_style" placeholder="如：语气亲切自然，用'您'称呼客户..." rows="2"></textarea>
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom:var(--space-4);">
          <div class="card-header">
            <h3>📏 服务规范</h3>
          </div>
          <div class="form-section">
            <div class="form-group">
              <label class="form-label">服务边界规则</label>
              <p class="form-hint" style="margin-bottom:var(--space-2);">不能做什么、不懂时怎么办</p>
              <textarea class="form-textarea" id="service_rules" placeholder="如：不能泄露客户隐私、不能猜测订单信息..." rows="3"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">处事原则</label>
              <p class="form-hint" style="margin-bottom:var(--space-2);">核心价值观</p>
              <textarea class="form-textarea" id="principles" placeholder="如：客户第一、诚信为本..." rows="3"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">情绪应对策略（可选）</label>
              <p class="form-hint" style="margin-bottom:var(--space-2);">客户生气、投诉时的应对方式</p>
              <textarea class="form-textarea" id="emotion_strategy" placeholder="客户生气/投诉时的应对方式..." rows="3"></textarea>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="saveBtn">💾 保存设置</button>
      </form>
    </div>
  </main>
</div>
<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

<div class="toast" id="toast"></div>

<style>
.toast-success { border-color: rgba(16, 185, 129, 0.4) !important; box-shadow: 0 0 24px rgba(16, 185, 129, 0.15), var(--shadow-lg) !important; }
.toast-error { border-color: rgba(244, 63, 94, 0.4) !important; box-shadow: 0 0 24px rgba(244, 63, 94, 0.15), var(--shadow-lg) !important; }
</style>

<script>
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  if (type === 'success') t.classList.add('toast-success');
  else if (type === 'error') t.classList.add('toast-error');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function getHeaders() {
  return { 'Content-Type': 'application/json' };
}

function apiUrl(path) {
  var dir = location.pathname.substring(0, location.pathname.lastIndexOf('/'));
  var base = dir.substring(0, dir.lastIndexOf('/') + 1);
  var sep = path.indexOf('?') > -1 ? '&' : '?';
  return base + (path.charAt(0) === '/' ? path.substring(1) : path) + sep + 'token=' + encodeURIComponent(token);
}

var token = localStorage.getItem('admin_token');

// ═══ 头像上传 ═══
document.getElementById('avatarFileInput').addEventListener('change', function() {
  var file = this.files[0];
  var uploadBtn = document.getElementById('uploadAvatarBtn');
  var statusEl = document.getElementById('avatarUploadStatus');
  if (file) {
    uploadBtn.disabled = false;
    statusEl.textContent = '已选择: ' + file.name;
    statusEl.style.color = 'var(--text-secondary)';
  } else {
    uploadBtn.disabled = true;
    statusEl.textContent = '';
  }
});

function uploadAvatar() {
  var fileInput = document.getElementById('avatarFileInput');
  var file = fileInput.files[0];
  if (!file) return;

  var btn = document.getElementById('uploadAvatarBtn');
  var statusEl = document.getElementById('avatarUploadStatus');
  btn.disabled = true;
  btn.textContent = '上传中...';
  statusEl.textContent = '正在上传...';
  statusEl.style.color = 'var(--text-secondary)';

  var formData = new FormData();
  formData.append('file', file);

  fetch(apiUrl('/api/persona.php?action=upload_avatar'), {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: formData
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.code === 0 && res.data && res.data.url) {
      document.getElementById('avatarPreview').src = res.data.url;
      document.getElementById('avatar_url').value = res.data.url;
      statusEl.innerHTML = '✅ 上传成功，正在保存...';
      fileInput.value = '';
      // 自动保存到数据库
      return fetch(apiUrl('/api/persona.php?action=save'), {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ avatar_url: res.data.url })
      });
    } else {
      btn.disabled = false;
      btn.textContent = '上传头像';
      statusEl.textContent = '❌ ' + (res.msg || '上传失败');
      statusEl.style.color = '#f43f5e';
      throw null;
    }
  })
  .then(function(saveRes) {
    btn.disabled = false;
    btn.textContent = '上传头像';
    if (saveRes && saveRes.code === 0) {
      statusEl.innerHTML = '✅ 上传成功，头像已更新';
      statusEl.style.color = '#10b981';
    } else {
      statusEl.textContent = '⚠️ 上传成功但保存失败，请点击页面底部"保存配置"';
      statusEl.style.color = '#f59e0b';
    }
  })
  .catch(function() {
    btn.disabled = false;
    btn.textContent = '上传头像';
  });
}

function clearAvatar() {
  document.getElementById('avatarPreview').src = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 72 72\'%3E%3Ccircle cx=\'36\' cy=\'36\' r=\'36\' fill=\'%233b82f6\'/%3E%3Ctext x=\'36\' y=\'46\' text-anchor=\'middle\' fill=\'white\' font-size=\'30\'%3E🤖%3C/text%3E%3C/svg%3E';
  document.getElementById('avatar_url').value = '';
  document.getElementById('avatarUploadStatus').textContent = '已清除头像';
  document.getElementById('avatarUploadStatus').style.color = 'var(--text-secondary)';
}

function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('active');
}

function doLogout() {
  localStorage.removeItem('admin_token');
  window.location.href = 'login.html';
}

fetch(apiUrl('/api/persona.php?action=get'), { headers: getHeaders() })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('personaForm').style.display = 'block';
    if (res.code === 0 && res.data) {
      var d = res.data;
      document.getElementById('name').value = d.name || '';
      document.getElementById('greeting').value = d.greeting || '';
      document.getElementById('description').value = d.description || '';
      document.getElementById('avatar_url').value = d.avatar_url || '';
      if (d.avatar_url) {
        document.getElementById('avatarPreview').src = d.avatar_url;
      }
      document.getElementById('brand_story').value = d.brand_story || '';
      document.getElementById('personality').value = d.personality || '';
      document.getElementById('speak_style').value = d.speak_style || '';
      document.getElementById('service_rules').value = d.service_rules || '';
      document.getElementById('principles').value = d.principles || '';
      document.getElementById('emotion_strategy').value = d.emotion_strategy || '';
    }
  });

document.getElementById('personaForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = document.getElementById('saveBtn');
  var origText = btn.innerHTML;
  btn.innerHTML = '⏳ 保存中...';
  btn.disabled = true;

  var data = {
    name: document.getElementById('name').value,
    greeting: document.getElementById('greeting').value,
    description: document.getElementById('description').value,
    avatar_url: document.getElementById('avatar_url').value,
    brand_story: document.getElementById('brand_story').value,
    personality: document.getElementById('personality').value,
    speak_style: document.getElementById('speak_style').value,
    service_rules: document.getElementById('service_rules').value,
    principles: document.getElementById('principles').value,
    emotion_strategy: document.getElementById('emotion_strategy').value,
  };

  fetch(apiUrl('/api/persona.php?action=save'), {
    method: 'POST',
    headers: getHeaders(),
    body: JSON.stringify(data)
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.code === 0) {
      btn.innerHTML = '✅ 保存成功';
      showToast('✅ 人设保存成功', 'success');
    } else {
      btn.innerHTML = '❌ 保存失败，重试';
      showToast('❌ ' + (res.msg || '保存失败'), 'error');
    }
    setTimeout(function() { btn.innerHTML = origText; btn.disabled = false; }, 2000);
  })
  .catch(function() {
    btn.innerHTML = '❌ 网络异常，重试';
    showToast('❌ 网络异常，请重试', 'error');
    setTimeout(function() { btn.innerHTML = origText; btn.disabled = false; }, 2000);
  });
});
</script>
</body>
</html>
